{% extends "base.html" %}
{% block content %}
<section>
    <h2>Edit expense</h2>
    <form method = "post" class = "edit-form">
        <label>Amount
            <input name="amount" value="{{ '%.2f' % (e.amount_cents/100)}}" required inputmode = "decimal">
        </label>
        <label>Date
            <input name = "date" type = "data" value = "{{e.date}}" required>
        </label>
        <label>Category
            <input name="Category" value = "{{e.category}}">
        </label>
        <label>Note
            <input name = "note" value = "{{e.note}}">
        </label>
        <div class = "form-actions">
            <button type = "submit">Save Changes</button>
            <a class = "btn-secondary" href = "{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
